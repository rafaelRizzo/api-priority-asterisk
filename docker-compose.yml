services:
  api-priority: #<--- isso é necessário e arbitrário (pode ser qlqr coisa, é o nome interno pro composer, desse conteiner)
    build: .
    image: rafaelrizzo/api-priority-asterisk # <---- nome da imagem aqui
    container_name: api-priority-asterisk #<---- esse é o nome de fato do contteiner
    ports:
      - "3133:3133"
    volumes:
      - ./combined.log:/usr/src/app/combined.log
      - ./error.log:/usr/src/app/error.log
    environment:
      NODE_ENV: production
      DATABASE_URL:
      API_TOKEN: 
      TZ: America/Sao_Paulo
    command: npm start
    restart: unless-stopped