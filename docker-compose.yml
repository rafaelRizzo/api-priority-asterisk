services:
  api-priority:
    build: .
    image: rafaelrizzo/api-priority-asterisk 
    container_name: api-priority-asterisk
    ports:
      - "3133:3133"
    volumes:
      - ./combined.log:/usr/src/app/combined.log
      - ./error.log:/usr/src/app/error.log
    environment:
      NODE_ENV: production
      DATABASE_URL:
      API_TOKEN: 
      TOKEN:
      TZ: America/Sao_Paulo
    command: npm start
    restart: unless-stopped